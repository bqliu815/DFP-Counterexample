name: MATLAB tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023a
          products: Optimization_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          select-by-folder: tests
